name: CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  # Keep the ci and e2e check names aligned with the protect-main ruleset
  # in GitHub. Ensure they report on every PR; path filters can block
  # merges. `verify` is a process status set by the verifier, not a job.
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      E2E_TELEMETRY_DISABLED: "1"
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Sample values only: e2e flows never reach Google or production.
      - run: cp .dev.vars.example .dev.vars
      # A fresh test login password per run (#93): the app lives only on this
      # runner, and pull requests from forks get no repository secrets.
      - name: Generate the test login password
        run: |
          password="$(openssl rand -hex 24)"
          echo "::add-mask::$password"
          sed -i "s/^TEST_LOGIN_PASSWORD=.*/TEST_LOGIN_PASSWORD=$password/" .dev.vars
          grep -q "^TEST_LOGIN_PASSWORD=$password$" .dev.vars
      - run: pnpm db:migrate:local
      - run: pnpm exec e2e-web install chromium --with-deps
      - run: pnpm test:e2e
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-results
          # .e2e/ is a hidden folder; v4.4+ skips those by default.
          include-hidden-files: true
          path: |
            .e2e/
            !.e2e/cache/
          retention-days: 7
