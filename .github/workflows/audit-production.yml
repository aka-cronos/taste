name: Audit production dependencies

on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Report production audit (informational)
        shell: bash
        run: |
          status=0
          pnpm audit --prod > "$RUNNER_TEMP/production-audit.txt" 2>&1 || status=$?
          {
            echo '## Production dependency audit'
            echo
            echo "Exit status: $status (informational; does not gate merges)."
            echo
            echo '```text'
            cat "$RUNNER_TEMP/production-audit.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
