name: Audit production dependencies

on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Report production audit (informational)
        shell: bash
        run: |
          status=0
          pnpm audit --prod > "$RUNNER_TEMP/production-audit.txt" 2>&1 || status=$?
          {
            echo '## Production dependency audit'
            echo
            echo "Exit status: $status (informational; does not gate merges)."
            echo
            echo '```text'
            cat "$RUNNER_TEMP/production-audit.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
