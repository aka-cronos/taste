name: Feature request
description: Propose an improvement.
labels: [ needs-triage ]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Use synthetic examples without secrets or personal data.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
