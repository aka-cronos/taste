name: Bug report
description: Report unexpected behavior.
labels: [ needs-triage ]
body:
  - type: markdown
    attributes:
      value: Use synthetic data. Report vulnerabilities privately through the Security tab.
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Browser, OS, and relevant app version or commit.
    validations:
      required: true
